<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Sorter</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    textarea { width: 100%; height: 150px; margin-bottom: 10px; padding: 10px; box-sizing: border-box;}
    button { padding: 10px 15px; margin-right: 5px; margin-bottom: 15px; cursor: pointer; background: #4285f4; color: white; border: none; border-radius: 5px;}
    button:hover { background: #3367d6; }
    .secondary-btn { background: #e0e0e0; color: #333; }
    .secondary-btn:hover { background: #d0d0d0; }
    .settings { background: #f1f3f4; padding: 15px; margin-bottom: 20px; border-radius: 5px; font-size: 0.9em; }
    input[type="password"], input[type="text"], select { padding: 8px; width: 100%; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box; }
    .hidden { display: none; }
    .list-item { display: flex; justify-content: space-between; background: #fff; padding: 8px; margin-bottom: 5px; border: 1px solid #ddd; border-radius: 4px; align-items: center;}
    .list-item button { padding: 5px 10px; margin: 0 0 0 5px; margin-bottom: 0; }
    hr { border: 0; border-top: 1px solid #ccc; margin: 20px 0; }
    a { color: #4285f4; }
  </style>
</head>
<body>

  <h1>Grocery Sorter</h1>
  
  <div class="settings">
    <label for="apiKey"><strong>Gemini API Key:</strong></label>
    <input type="password" id="apiKey" placeholder="Paste your API key here...">
    <small><a href="[https://aistudio.google.com/app/apikey](https://aistudio.google.com/app/apikey)" target="_blank">Get your free Gemini API key here</a></small>
  </div>

  <button id="toggleSettings" class="secondary-btn">⚙️ Manage Categories & Supermarkets</button>

  <div id="settingsPanel" class="settings hidden">
    <h3>Categories</h3>
    <div style="display:flex;">
      <input type="text" id="newCategory" placeholder="New category name (e.g., Pets)">
      <button id="btnAddCategory" style="margin-left:5px; margin-top:5px; height: 35px;">Add</button>
    </div>
    <div id="categoryList"></div>

    <hr>
    
    <h3>Supermarkets</h3>
    <div style="display:flex;">
      <input type="text" id="newSupermarket" placeholder="e.g., Aldi, Tesco">
      <button id="btnAddSupermarket" style="margin-left:5px; margin-top:5px; height: 35px;">Add</button>
    </div>
    <div id="supermarketList"></div>

    <div id="supermarketLayoutArea" class="hidden">
      <hr>
      <h4 id="layoutTitle">Edit Layout</h4>
      <p><small>Move categories up or down to match the store layout.</small></p>
      <div id="layoutList"></div>
    </div>
  </div>
  
  <label for="supermarketSelect"><strong>Sorting For:</strong></label>
  <select id="supermarketSelect">
    <option value="Default">Default Order</option>
  </select>
  
  <label for="inputList" style="margin-top: 10px; display:block;"><strong>Raw List (from Keep):</strong></label>
  <textarea id="inputList" placeholder="Paste list here, or share from Google Keep..."></textarea>
  
  <button id="btnSort">✨ Sort with AI</button>

  <label for="outputList"><strong>Organized List:</strong></label>
  <textarea id="outputList" placeholder="Categorized list will appear here..."></textarea>
  
  <button id="btnShare">Share back to Keep</button>
  <button id="btnCopy">Copy to Clipboard</button>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
</body>
</html>
